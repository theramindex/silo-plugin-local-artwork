name: Publish

# Builds and publishes a v* tag, then updates the catalog. Start a release from the
# Release workflow, which pushes the tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Resolve version
        id: version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: make test

      - name: Build release binaries
        run: make checksums BINARY=plugin VERSION="${{ steps.version.outputs.version }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Local Artwork for Silo $TAG"
          gh release upload "$TAG" dist/plugin-* dist/checksums.txt --clobber

      - uses: actions/upload-artifact@v6
        with:
          name: silo-local-artwork-dist
          path: dist/

  catalog:
    needs: release
    uses: theramindex/silo-plugins/.github/workflows/publish-plugin.yml@main
    with:
      plugin-id: silo.ramindex.local-metadata
      display-name: Local Artwork
      asset-prefix: plugin-
    secrets: inherit
